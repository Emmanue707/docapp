name: android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "crates/docsuite-ffi/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "crates/docsuite-ffi/**"]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
      - run: ./gradlew assembleDebug testDebugUnitTest