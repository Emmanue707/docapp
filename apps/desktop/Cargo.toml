[package]
name = "docapp-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "docapp-desktop"
path = "src/main.rs"

[dependencies]
docsuite-core = { path = "../../crates/docsuite-core" }
docsuite-viewer = { path = "../../crates/docsuite-viewer", features = ["pdfium"] }
docsuite-pdf = { path = "../../crates/docsuite-pdf" }
docsuite-convert = { path = "../../crates/docsuite-convert", features = ["pdfium", "typst"] }
docsuite-ocr = { path = "../../crates/docsuite-ocr", features = ["ocrs", "htr"] }
docsuite-models = { path = "../../crates/docsuite-models", features = ["download"] }
eframe.workspace = true
rfd.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
anyhow = { workspace = true, features = ["std"] }
image = { workspace = true }