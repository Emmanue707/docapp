[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]
default-members = [
    "crates/docsuite-core",
    "crates/docsuite-viewer",
    "crates/docsuite-ocr",
    "crates/docsuite-pdf",
    "crates/docsuite-convert",
    "crates/docsuite-cli",
    "crates/docsuite-ffi",
]

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Emmanue707/docapp"
authors = ["Emmanuel Kokele"]

[workspace.dependencies]
thiserror = { version = "2", default-features = false }
anyhow = { version = "1", default-features = false }
lopdf = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
clap = { version = "4", default-features = false, features = ["derive", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uniffi = { version = "0.28", default-features = false }
eframe = { version = "0.31", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
ocrs = { version = "0.14", default-features = false, features = ["onnx"] }
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-imageproc = { version = "0.28", default-features = false }
rten-tensor = { version = "0.28", default-features = false }
sha2 = { version = "0.11", default-features = false }
cms = { version = "0.3.0-rc.2", default-features = false, features = [
    "std",
    "builder",
    "digest",
] }
der = { version = "0.8", default-features = false, features = ["alloc", "oid", "std", "derive"] }
x509-cert = { version = "0.3.1", default-features = false, features = [
    "builder",
    "std",
    "pem",
] }
rsa = { version = "0.10", default-features = false, features = ["encoding", "std", "getrandom", "pkcs1v15"] }
p256 = { version = "0.14", default-features = false, features = [
    "ecdsa",
    "pem",
    "pkcs8",
] }
pkcs8 = { version = "0.11", default-features = false, features = [
    "pem",
    "std",
    "pkcs5",
] }
pkcs12 = { version = "0.2.0-rc.0", default-features = false, features = [
    "pem",
    "kdf",
    "zeroize",
] }
spki = { version = "0.8", default-features = false, features = ["std"] }
signature = { version = "3", default-features = false, features = ["digest", "alloc"] }
const-oid = { version = "0.10", default-features = false }
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
ecdsa = { version = "0.17", default-features = false, features = ["pem", "pkcs8", "digest"] }
elliptic-curve = { version = "0.14", default-features = false, features = ["pkcs8"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }
getrandom = { version = "0.3", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
quick-xml = { version = "0.37", default-features = false, features = ["encoding"] }
typst = { version = "0.15.1", default-features = false }
typst-pdf = { version = "0.15.1", default-features = false }
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
opt-level = 3