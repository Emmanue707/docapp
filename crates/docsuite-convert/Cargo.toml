[package]
name = "docsuite-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
pdfium = ["dep:pdfium-render"]

[dependencies]
docsuite-core = { path = "../docsuite-core" }
docsuite-ocr = { path = "../docsuite-ocr" }
docsuite-pdf = { path = "../docsuite-pdf" }
image = { workspace = true }
lopdf = { workspace = true }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "image"], optional = true }
zip.workspace = true

[dev-dependencies]
lopdf = { workspace = true }

[[test]]
name = "pdf_image"
path = "tests/pdf_image.rs"
required-features = ["pdfium"]