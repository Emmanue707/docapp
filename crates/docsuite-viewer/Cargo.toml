[package]
name = "docsuite-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
pdfium = ["dep:pdfium-render"]

[dependencies]
docsuite-core = { path = "../docsuite-core" }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "image"], optional = true }

[dev-dependencies]